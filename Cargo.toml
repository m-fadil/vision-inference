[package]
name = "vision-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Face and scene inference primitives backed by ONNX Runtime"
license = "Apache-2.0"

[dependencies]
image = { version = "0.25", default-features = false }
ndarray = "0.17"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["ndarray", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
